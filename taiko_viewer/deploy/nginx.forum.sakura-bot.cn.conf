server {
    listen 80;
    server_name forum.sakura-bot.cn;
    return 301 https://viewer.sakura-bot.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forum.sakura-bot.cn;

    include /www/server/panel/vhost/nginx/well-known/forum.sakura-bot.cn.conf;

    ssl_certificate     /www/server/panel/vhost/cert/forum.sakura-bot.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/forum.sakura-bot.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    location = / {
        return 301 https://viewer.sakura-bot.cn/forum;
    }

    location / {
        return 301 https://viewer.sakura-bot.cn$request_uri;
    }

    access_log /www/wwwlogs/forum.sakura-bot.cn.log;
    error_log /www/wwwlogs/forum.sakura-bot.cn.error.log;
}
