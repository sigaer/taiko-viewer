server {
    listen 80;
    server_name forum.sakura-bot.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name forum.sakura-bot.cn;

    include /www/server/panel/vhost/nginx/well-known/forum.sakura-bot.cn.conf;

    ssl_certificate     /www/server/panel/vhost/cert/forum.sakura-bot.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/forum.sakura-bot.cn/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    root /home/sigaer/taiko/taiko-forum/taiko_viewer/.output/public;

    location = / {
        return 302 https://forum.sakura-bot.cn/forum;
    }

    location ^~ /_nuxt/ {
        try_files $uri @forum;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|css|js|map|woff2?|ttf)$ {
        try_files $uri @forum;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location @forum {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /www/wwwlogs/forum.sakura-bot.cn.log;
    error_log /www/wwwlogs/forum.sakura-bot.cn.error.log;
}
