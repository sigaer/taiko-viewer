name: Developer API batch 1

on:
  pull_request:
    branches: [main]
    paths:
      - "taiko_viewer/**"
      - "packages/sakura-taiko-contract/**"
      - ".github/workflows/developer-api-batch1.yml"
  push:
    branches: [main]
    paths:
      - "taiko_viewer/**"
      - "packages/sakura-taiko-contract/**"
      - ".github/workflows/developer-api-batch1.yml"

permissions:
  contents: read

jobs:
  contract-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sigaer/taiko-bot
          ref: a632913dfbdbec1d465f8eaccc0bb80c35e25745
          path: taiko-bot-source
      - name: Prepare pinned shared Annual schema
        run: |
          schema_dir="$(dirname "$(dirname "$GITHUB_WORKSPACE")")/schemas"
          mkdir -p "$schema_dir"
          cp taiko-bot-source/taiko_bot/offline/schemas/annual-summary-v4.schema.json "$schema_dir/annual-summary-v4.schema.json"
          test -s "$schema_dir/annual-summary-v4.schema.json"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: taiko_viewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Diagnose and regenerate npm lock metadata
        working-directory: taiko_viewer
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --stat -- package-lock.json
          git diff -- package-lock.json | sed -n '1,600p'
          node -e "const l=require('./package-lock.json'); console.log(JSON.stringify(Object.entries(l.packages).filter(([k])=>/dxup\\/nuxt|magic-string|unplugin/.test(k)).map(([path,p])=>({path,version:p.version,resolved:p.resolved,integrity:p.integrity,dependencies:p.dependencies})),null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: taiko_viewer/package-lock.json
          retention-days: 1
      - name: Install locked dependencies
        working-directory: taiko_viewer
        run: npm ci
      - name: Verify generated Contract bindings
        working-directory: packages/sakura-taiko-contract
        run: python -I tools/generate_bindings.py --check
      - name: Verify version projection and API batch regression tests
        working-directory: taiko_viewer
        run: node --experimental-strip-types --test tests/versionProjection.test.mjs tests/developerApiBatch1.test.mjs
      - name: Verify cross-language catalog Golden
        working-directory: packages/sakura-taiko-contract
        run: python -I tests/test_api_v1.py
      - name: Build production Nuxt output
        working-directory: taiko_viewer
        run: npm run build
