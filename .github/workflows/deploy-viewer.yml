name: Deploy Taiko Viewer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep production changes serial; a newer push must not kill an active deployment.
concurrency:
  group: viewer-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/developer-api-batch1.yml

  deploy:
    needs: validate
    if: >-
      github.repository == 'sigaer/taiko-viewer' &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Deploy the validated main commit through the standard host script
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}" "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_KEY:?Missing DEPLOY_KEY}" "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/viewer-deploy.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          ssh -T -p "${DEPLOY_PORT:-22}" -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $TESTED_COMMIT"
          printf 'Deployed `%s` to https://viewer.sakura-bot.cn\n' "$TESTED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
