<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Viewer 1.0 产品设计评审</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="review-bar" aria-label="设计评审控制"><strong>Viewer · 设计评审</strong><span class="review-note">合成玩家数据 · 操作仅在本页演示</span><label>页面<select id="review-page"><option value="home">A 首页 / My Taiko</option><option value="song">B 歌曲详情</option><option value="training">C 练习</option><option value="progress">C 成长</option></select></label><label>状态<select id="review-state"><option value="ready">正常</option><option value="guest">未登录</option><option value="unbound">未绑定</option><option value="empty">暂无成绩</option><option value="no-goal">未设目标</option><option value="loading">加载中</option><option value="error">读取失败</option><option value="completed">目标完成</option><option value="partial">记录不完整</option></select></label><label>语言<select id="review-lang"><option value="zh">中文</option><option value="ja">日本語</option></select></label><button id="review-theme" aria-label="切换深浅主题">深色</button></div>
<div class="viewer-app" id="viewer-app">
<a class="skip-link" href="#content">跳到内容</a>
<aside class="sidebar"><a class="brand" href="#home"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><span>SAKURA<strong>TAIKO VIEWER</strong></span></a><nav id="desktop-nav" aria-label="主导航"></nav><div class="sidebar-bottom"><a href="#docs" data-info="API 指南在后续文档导航改造中承接；本原型不请求接口。">API 指南 ↗</a><a href="#profile" data-info="个人中心保留账号、绑定、授权与同步管理。">设置与帮助</a><small>My Taiko, in one place.</small></div></aside>
<div class="workspace"><header class="app-header"><a class="mobile-brand" href="#home"><span class="brand-mark" aria-hidden="true"><i></i><b></b></span><b>Taiko Viewer</b></a><div class="global-search"><label class="sr-only" for="song-search">搜索歌曲</label><button id="search-trigger" class="search-trigger" aria-label="打开歌曲搜索">⌕</button><input id="song-search" placeholder="搜索曲名、日文名或 ID" type="search"><kbd>/</kbd></div><button class="account-button" data-info="当前为合成账号；切换账号会清除旧页面结果。"><span class="avatar">咚</span><span id="header-name">樱花鼓众</span><span aria-hidden="true">⌄</span></button></header>
<main id="content" tabindex="-1"></main><footer class="page-footer">Sakura Taiko Viewer <span>国服曲库 · 你的练习与成长</span></footer></div>
<nav class="bottom-nav" id="bottom-nav" aria-label="手机主导航"></nav>
</div>
<dialog id="goal-dialog" aria-labelledby="goal-dialog-title"><form method="dialog"><button class="dialog-close" aria-label="关闭">×</button></form><p class="eyebrow">练习目标</p><h2 id="goal-dialog-title">这首歌，想进步在哪？</h2><p class="dialog-song">无敌的HAPPINESS! <span class="difficulty oni">魔王 ★7</span></p><form id="goal-form"><fieldset><legend class="sr-only">选择目标</legend><label class="goal-option"><input type="radio" name="goal" value="ng" required><span><strong>减少不可</strong><small>当前 1 个不可 · 下次少于 1 个</small></span></label><label class="goal-option"><input type="radio" name="goal" value="score"><span><strong>刷新最好成绩</strong><small>当前最好 980,000 分</small></span></label></fieldset><p class="muted">更新成绩后，再检查这次进步。</p><div class="actions"><button type="button" class="button secondary" id="goal-cancel">取消</button><button class="button primary" type="submit">确认目标</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="app.js"></script>
</body></html>
