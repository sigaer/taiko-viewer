openapi: 3.1.0
info:
  title: Viewer Developer API — Batch 1 proposal
  version: 0.85.0-rc.1
  description: Additive proposal only. The frozen Contract v1.0 schema and its existing OpenAPI document are unchanged.
servers:
  - url: https://viewer.sakura-bot.cn
paths:
  /api/v1/taiko/catalog/aliases:
    get:
      operationId: getCatalogAliases
      description: Public song aliases and Japanese titles. Any supplied Bearer token is validated.
      security:
        - {}
        - DeveloperToken: []
      responses:
        "200":
          description: Bounded alias catalog
          content:
            application/json:
              schema:
                type: object
                required: [versions, items]
                properties:
                  versions: { type: object }
                  items:
                    type: array
                    items:
                      type: object
                      required: [songId, aliases, japaneseTitle]
                      properties:
                        songId: { type: integer, minimum: 1 }
                        aliases: { type: array, maxItems: 100, items: { type: string } }
                        japaneseTitle: { type: [string, "null"] }
        "401": { description: Invalid supplied Developer Token }
        "503": { description: Alias source unavailable or exceeds its size limit }
  /api/developer/userdata/{userid}/rating:
    get:
      operationId: getDeveloperRating
      description: Uses the same authorization and cross-user current-score read rules as the existing Developer userdata endpoint. Returns overall Rating, six dimensions, sample count, algorithm metadata and up to 30 top-rated chart details.
      security:
        - DeveloperToken: []
      parameters:
        - name: userid
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Rating summary and top-30 details from one score snapshot
          content:
            application/json:
              schema:
                type: object
                required: [playerId, scoreRevision, model, aggregation, topN, sampleCount, dimensions, topSongs, topSongsCount]
                properties:
                  playerId: { type: string }
                  scoreRevision: { type: string, description: SHA-256 of the captured score records and metadata }
                  model: { type: string }
                  aggregation: { type: string }
                  topN: { type: integer }
                  sampleCount: { type: integer, minimum: 0 }
                  overallRating: { type: [number, "null"] }
                  dimensions: { type: array, items: { type: object } }
                  topSongsCount: { type: integer, minimum: 0, maximum: 30 }
                  topSongs: { type: array, maxItems: 30, items: { type: object } }
        "401": { description: Missing or invalid authentication }
        "403": { description: Source is not authorized for this caller }
        "429": { description: Existing Developer userdata quota exceeded }
        "503": { description: Score snapshot changed or analysis unavailable }
  /api/developer/userdata/{userid}/recommendations:
    get:
      operationId: getDeveloperRecommendations
      description: Uses the same authorization as the existing Developer userdata endpoint and returns the existing rating-based recommendation algorithm's structured result.
      security:
        - DeveloperToken: []
      parameters:
        - name: userid
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: Structured rating-based recommendation result }
        "401": { description: Missing or invalid authentication }
        "403": { description: Source is not authorized for this caller }
        "429": { description: Existing Developer userdata quota exceeded }
        "503": { description: Score snapshot changed or analysis unavailable }
components:
  securitySchemes:
    DeveloperToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Existing Developer Token authorization; no new ResourceGrant is introduced by these analysis routes.
