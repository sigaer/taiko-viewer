                    requestId: 00000000-0000-4000-8000-000000000000
                UNAVAILABLE:
                  value:
                    code: UNAVAILABLE
                    message: UNAVAILABLE
                    requestId: 00000000-0000-4000-8000-000000000000
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      x-example-policy: Synthetic examples only; no live account/key/score bytes.
