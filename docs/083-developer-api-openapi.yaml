openapi: 3.1.0
info:
  title: Viewer Developer API v1 — locally frozen Contract v1.0
  version: 0.85.0-rc.1
  description: "CONTRACT FROZEN LOCALLY / NOT DEPLOYED. Explicit local opt-in required. External read surface has
    one prefix: /api/v1/taiko. Session consent management is separate. Only profile:read and
    scores:read are open. This document does not register production access or upgrade legacy tokens
    into ResourceGrants."
servers:
  - url: http://127.0.0.1:{port}
    description: Owned isolated local test listener only
    variables:
      port:
        default: "43083"
        description: Use the actual admitted run loopback port; no production default.
paths:
  /api/v1/taiko/meta:
    get:
      operationId: getMeta
      description: Locally frozen contract only. Anonymous public metadata, same source catalog revision;
        no production availability claim.
      security:
        - {}
        - ClientKey: []
      responses:
        "200":
          description: Completed read
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  apiVersion:
                    const: v1
                  contractVersion:
                    const: "1.0"
                  schemaRevision:
                    type: string
                  catalogRevision:
                    type: string
                  capabilities:
                    type: array
                    items:
                      enum:
                        - catalog:read
                        - profile:read
                        - scores:read
                  unavailableScopes:
                    type: array
                    items:
                      enum:
                        - history:read
                        - growth:read
                  status:
                    enum:
                      - FREEZE_CANDIDATE
                      - CONTRACT_FROZEN
                    description: Release-controlled contract lifecycle; independent of runtime enablement.
                      CONTRACT_FROZEN requires separate recorded Owner approval; does not assert
                      production activation.
                  catalogProfile:
                    const: source-catalog-explicit-v1
                  pagination:
                    const: none-bounded-complete-response
                  contractFrozen:
                    type: boolean
                  runtimeEnabled:
                    const: true
                    description: This responding host only. Disabled hosts return 404; does not assert production
                      enablement.
                required:
                  - apiVersion
                  - contractVersion
                  - schemaRevision
                  - catalogRevision
                  - capabilities
                  - unavailableScopes
                  - status
                  - catalogProfile
                  - pagination
                  - contractFrozen
                  - runtimeEnabled
                allOf:
                  - if:
                      properties:
                        status:
                          const: FREEZE_CANDIDATE
                    then:
                      properties:
                        contractFrozen:
                          const: false
                  - if:
                      properties:
                        status:
                          const: CONTRACT_FROZEN
                    then:
                      properties:
                        contractFrozen:
                          const: true
              example:
                apiVersion: v1
                contractVersion: "1.0"
                schemaRevision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                catalogRevision: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                capabilities:
                  - catalog:read
                  - profile:read
                  - scores:read
                unavailableScopes:
                  - history:read
                  - growth:read
                status: CONTRACT_FROZEN
                catalogProfile: source-catalog-explicit-v1
                pagination: none-bounded-complete-response
                contractFrozen: true
                runtimeEnabled: true
        "304":
          description: Revalidated representation. Private requests complete all live authority checks before
            304.
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
        "400":
          description: Invalid request; unknown query/body fields rejected
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: INVALID_REQUEST
                message: INVALID_REQUEST
                requestId: 00000000-0000-4000-8000-000000000000
        "401":
          description: Missing/invalid initial client or Viewer session identity
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: UNAUTHENTICATED
                message: UNAUTHENTICATED
                requestId: 00000000-0000-4000-8000-000000000000
        "403":
          description: Missing grant, wrong binding/client/scope/audience, late revocation or invalid consent
            origin
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: GRANT_REQUIRED
                message: GRANT_REQUIRED
                requestId: 00000000-0000-4000-8000-000000000000
        "404":
          description: Candidate disabled or route absent
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: NOT_FOUND
                message: NOT_FOUND
                requestId: 00000000-0000-4000-8000-000000000000
        "429":
          description: Atomic shared daily quota exhausted
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: RATE_LIMITED
                message: RATE_LIMITED
                requestId: 00000000-0000-4000-8000-000000000000
        "503":
          description: "No complete representation available: CATALOG_LIMIT_EXCEEDED (>10000 catalog rows or
            source >8 MiB), SCORES_LIMIT_EXCEEDED (>20000 records), RESPONSE_LIMIT_EXCEEDED
            (serialized UTF-8 JSON >8 MiB), PUBLICATION_REQUIRED, or UNAVAILABLE
            (invalid/unavailable data). No truncated 200/304, no partial items; private,no-store.
