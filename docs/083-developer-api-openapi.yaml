openapi: 3.1.0
info:
  title: Viewer Developer API v1 — local Freeze Candidate
  version: 0.83.0-rc.1
  description: "NOT FROZEN / NOT DEPLOYED. Explicit local opt-in required. External read surface has
    one prefix: /api/v1/taiko. Session consent management is separate. Only profile:read and
    scores:read are open. This document does not register production access or upgrade legacy tokens
    into ResourceGrants."
servers:
  - url: http://127.0.0.1:{port}
    description: Owned isolated local test listener only
    variables:
      port:
        default: "43083"
        description: Use the actual admitted run loopback port; no production default.
paths:
  /api/v1/taiko/meta:
    get:
      operationId: getMeta
      description: Local Freeze Candidate only. Anonymous public metadata, same source catalog revision;
        no production availability claim.
      security:
        - {}
        - ClientKey: []
      responses:
        "200":
          description: Completed read
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  apiVersion:
                    const: v1
                  contractVersion:
                    const: "1.0"
                  schemaRevision:
                    type: string
                  catalogRevision:
                    type: string
                  capabilities:
                    type: array
                    items:
                      enum:
                        - catalog:read
                        - profile:read
                        - scores:read
                  unavailableScopes:
                    type: array
                    items:
                      enum:
                        - history:read
                        - growth:read
                  status:
                    const: FREEZE_CANDIDATE
                  catalogProfile:
                    const: source-catalog-explicit-v1
                  pagination:
                    const: none-bounded-complete-response
                required:
                  - apiVersion
                  - contractVersion
                  - schemaRevision
                  - catalogRevision
                  - capabilities
                  - unavailableScopes
                  - status
                  - catalogProfile
                  - pagination
              example:
                apiVersion: v1
                contractVersion: "1.0"
                schemaRevision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                catalogRevision: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                capabilities:
                  - catalog:read
                  - profile:read
                  - scores:read
                unavailableScopes:
                  - history:read
                  - growth:read
                status: FREEZE_CANDIDATE
                catalogProfile: source-catalog-explicit-v1
                pagination: none-bounded-complete-response
        "304":
          description: Revalidated representation. Private requests complete all live authority checks before
            304.
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
        "400":
          description: Invalid request; unknown query/body fields rejected
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: INVALID_REQUEST
                message: INVALID_REQUEST
                requestId: 00000000-0000-4000-8000-000000000000
        "401":
          description: Missing/invalid initial client or Viewer session identity
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: UNAUTHENTICATED
                message: UNAUTHENTICATED
                requestId: 00000000-0000-4000-8000-000000000000
        "403":
          description: Missing grant, wrong binding/client/scope/audience, late revocation or invalid consent
            origin
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: GRANT_REQUIRED
                message: GRANT_REQUIRED
                requestId: 00000000-0000-4000-8000-000000000000
        "404":
          description: Candidate disabled or route absent
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: NOT_FOUND
                message: NOT_FOUND
                requestId: 00000000-0000-4000-8000-000000000000
        "429":
          description: Atomic shared daily quota exhausted
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: RATE_LIMITED
                message: RATE_LIMITED
                requestId: 00000000-0000-4000-8000-000000000000
        "503":
          description: Unavailable schema/data/publication; no private diagnostic output
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../packages/sakura-taiko-contract/schema/contract-v1.json#/$defs/ApiError
              example:
                code: UNAVAILABLE
                message: UNAVAILABLE
                requestId: 00000000-0000-4000-8000-000000000000
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      x-example-policy: Synthetic examples only; no live account/key/score bytes.
