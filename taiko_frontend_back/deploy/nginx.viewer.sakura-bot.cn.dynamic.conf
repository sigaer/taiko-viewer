map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream taiko_nuxt_upstream {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    server_name viewer.sakura-bot.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name viewer.sakura-bot.cn;

    # Replace with your certificate paths
    ssl_certificate     /etc/letsencrypt/live/viewer.sakura-bot.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viewer.sakura-bot.cn/privkey.pem;

    # Static assets generated by `npm run build`
    root /home/sigaer/taiko/taiko_frontend_back/.output/public;

    # Keep static assets on Nginx, route HTML to Nuxt for dynamic SSR
    location ^~ /_nuxt/ {
        try_files $uri @nuxt;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|css|js|map|woff2?|ttf)$ {
        try_files $uri @nuxt;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        proxy_pass http://taiko_nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    location @nuxt {
        proxy_pass http://taiko_nuxt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
