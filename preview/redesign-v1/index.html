<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- D10：在任何样式加载前写入主题、语言与减少动效，深色用户首屏不闪白。
         V1.3：同时写入对照版本（?variant= 地址参数优先，其次本地设置），版本 C 的深色首屏不先闪藍墨 -->
    <script>
      ;(function () {
        var d = document.documentElement
        var s = {}
        try {
          s = JSON.parse(localStorage.getItem('tv-design-v1') || '{}') || {}
        } catch (e) {}
        var q = {}
        try {
          var u = new URLSearchParams(location.search)
          q.variant = u.get('variant')
          q.theme = u.get('theme')
        } catch (e) {}
        var t = q.theme === 'light' || q.theme === 'dark' ? q.theme : s.theme === 'light' || s.theme === 'dark' ? s.theme : null
        if (!t) {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (e) {
            t = 'light'
          }
        }
        d.dataset.theme = t
        d.lang = s.locale === 'ja' ? 'ja' : 'zh-CN'
        if (s.motion === 'reduce') d.dataset.motion = 'reduce'
        // Phase B：默认 C+；Phase A 期间存下的版本选择（没有 variantRev）不沿用
        var v = /^[abc]$/.test(q.variant || '') ? q.variant : s.variantRev === 'phase-b' && /^[abc]$/.test(s.variant || '') ? s.variant : 'c'
        d.dataset.assets = v === 'a' ? 'generated' : 'authentic'
        d.dataset.brand = v === 'c' ? 'teal' : 'fumen'
      })()
    </script>
    <!-- 关键底色：与 tokens.css 的 --bg 一致（浅 --ai-50，深 --ai-900） -->
    <style>
      html {
        color-scheme: light;
        background: #f3f5f8;
        color: #17203a;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        background: #101728;
        color: #e9edf7;
      }
      /* C+（Viewer Teal，默认）：与 tokens.css 的 teal --bg / --ink 一致（深色 --bg 是 C+ G1 的 #0c2023）。
         上面两条是历史版本 A、B（fumen）的底色 */
      html[data-brand='teal'] {
        background: #eaf6f5;
        color: #203f43;
      }
      html[data-brand='teal'][data-theme='dark'] {
        background: #0c2023;
        color: #e4f4f1;
      }
    </style>
    <title>Taiko Viewer · Design V1.3</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
